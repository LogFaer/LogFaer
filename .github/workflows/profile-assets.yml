name: Profile assets

# Generates the animated profile art and publishes it to the `output` branch:
#   - github-snake.svg / github-snake-dark.svg   (Platane/snk)
#   - profile-*.svg                               (3D contribution calendar)
#
# The README links these from raw.githubusercontent.com/<owner>/<repo>/output/...
# so nothing depends on a third-party service being online.
#
# First run: Actions tab -> "Profile assets" -> "Run workflow".
# After that it refreshes itself once a day.
#
# Requires: Settings -> Actions -> General -> Workflow permissions
#           -> "Read and write permissions".

on:
  workflow_dispatch:
  schedule:
    - cron: "22 2 * * *" # daily, 02:22 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect assets
        run: |
          mkdir -p dist
          cp profile-3d-contrib/*.svg dist/ 2>/dev/null || true
          ls -la dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
