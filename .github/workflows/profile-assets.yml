name: Profile assets

# Generates the grayscale contribution-snake and publishes it to the `output`
# branch, so the README can link it from raw.githubusercontent.com and never
# depends on a third-party service being online.
#
# First run: Actions tab -> "Profile assets" -> "Run workflow".
# After that it refreshes itself once a day.
#
# Requires: Settings -> Actions -> General -> Workflow permissions
#           -> "Read and write permissions".

on:
  workflow_dispatch:
  schedule:
    - cron: "22 2 * * *" # daily, 02:22 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contribution snake (grayscale)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#5a5a5a&color_dots=#ebedf0,#c6c6c6,#9a9a9a,#6e6e6e,#454545
            dist/snake-dark.svg?color_snake=#c8c8c8&color_dots=#161b22,#31363b,#555c62,#8b949e,#e6edf3

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
