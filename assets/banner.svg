<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img" aria-label="LogFaer — Technical Artist, Unity Developer, Shader Alchemist">
  <defs>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e8e8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8e8e8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8e8e8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.028"/>
    </pattern>
    <clipPath id="slice"><rect x="0" y="64" width="860" height="9"/></clipPath>
  </defs>

  <rect width="860" height="200" fill="#0d1117"/>
  <ellipse cx="430" cy="92" rx="380" ry="120" fill="url(#glow)"/>

  <g fill="none" stroke="#c8c8c8" stroke-opacity="0.16" stroke-width="1.3">
    <polygon points="784,64 806,77 806,103 784,116 762,103 762,77">
      <animateTransform attributeName="transform" type="rotate" from="0 784 90" to="360 784 90" dur="52s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="76,64 98,77 98,103 76,116 54,103 54,77">
      <animateTransform attributeName="transform" type="rotate" from="360 76 90" to="0 76 90" dur="60s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- wordmark: grey ghost (chromatic-split feel, no colour) + solid -->
  <text x="435" y="99" text-anchor="middle" font-family="'Trajan Pro', Cinzel, Georgia, 'Times New Roman', serif" font-size="55" letter-spacing="13" fill="#4a4a4a">LogFaer</text>
  <text x="434" y="99" text-anchor="middle" font-family="'Trajan Pro', Cinzel, Georgia, 'Times New Roman', serif" font-size="55" letter-spacing="13" fill="#ededed">LogFaer</text>

  <!-- rare glitch slip on one scanline band -->
  <g clip-path="url(#slice)">
    <text x="434" y="99" text-anchor="middle" font-family="'Trajan Pro', Cinzel, Georgia, 'Times New Roman', serif" font-size="55" letter-spacing="13" fill="#ffffff">LogFaer
      <animate attributeName="x" values="434;434;434;434;434;434;434;434;434;443;434;434;434;434;425;434;434;434;434;434" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
  </g>

  <rect y="117" height="1.6" fill="url(#rule)">
    <animate attributeName="x" values="320;250;320" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="width" values="220;360;220" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text x="430" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#767676" letter-spacing="6">TECHNICAL ARTIST &#8226; UNITY DEVELOPER &#8226; SHADER ALCHEMIST</text>

  <rect width="860" height="200" fill="url(#scan)"/>

  <rect width="860" height="46" fill="#ffffff" opacity="0.035">
    <animate attributeName="y" values="-46;200" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
